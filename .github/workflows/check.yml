name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: scripts/check.sh
