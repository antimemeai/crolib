[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crolib"
version = "0.1.0"
description = "Generalizability theory: crossed-design reliability and D-study projections"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Patrick Beam", email = "patrick@massmind.ai"}]
keywords = ["generalizability", "psychometrics", "reliability", "measurement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/antimemeai/crolib"
Issues = "https://github.com/antimemeai/crolib/issues"

[tool.setuptools.packages.find]
where = ["python"]
include = ["crolib*"]
